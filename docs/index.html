<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GitHub Billing Dashboard</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header>
    <h1>GitHub Billing Dashboard</h1>
    <p>User: krishnaharshap</p>
  </header>
  <div class="container" id="dashboardContainer">
    <div class="chart-container">
      <canvas id="chartActions"></canvas>
    </div>
    <div class="chart-container">
      <canvas id="chartPackages"></canvas>
    </div>
    <div class="chart-container">
      <canvas id="chartShared"></canvas>
    </div>
    <div class="table-container">
      <h2>Usage History</h2>
      <table id="usageTable">
        <thead>
          <tr>
            <th>Date</th>
            <th>Actions Minutes</th>
            <th>Packages Storage (GB)</th>
            <th>Shared Storage (GB)</th>
          </tr>
        </thead>
        <tbody>
          <!-- JS will populate table rows -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="assets/js/dashboard.js"></script>
</body>
</html>
